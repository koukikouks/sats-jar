[package]
name = "signer-stand-in"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "=5.30.1"
# RFC 6979 signing needs no randomness, so it runs in wasm.
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa"] }

[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["non-contract-usage"] }
